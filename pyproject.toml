[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpipulse"
version = "0.1.0"
description = "CLI para escaneo BLE y estadísticas locales"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "RPIpulse" }]
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]
test = ["pytest>=7.0"]

[project.scripts]
rpipulse = "rpipulse.cli:main"
analizador = "rpipulse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
