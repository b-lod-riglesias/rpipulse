[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpipulse"
version = "0.1.0"
description = "CLI para escaneo BLE y estadísticas locales"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "RPIpulse" }]
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]
ui = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]
test = [
  "pytest>=7.0",
  "fastapi>=0.111",
  "jinja2>=3.1",
  "httpx>=0.27",
]
terminal = [
  "asyncssh>=2.14",
]

[project.scripts]
rpipulse = "rpipulse.cli:main"
analizador = "rpipulse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rpipulse.webui" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

