{% macro top_nav(active) -%}
<nav class="hidden md:flex flex-1 items-center justify-center gap-1">
  <a class="rounded-md px-4 py-2 text-sm font-medium transition-colors {% if active == 'dashboard' %}bg-surface-highlight text-primary{% else %}text-text-muted hover:bg-surface-highlight hover:text-text-main{% endif %}" href="/dashboard">Dashboard Command</a>
