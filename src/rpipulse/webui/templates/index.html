<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPIpulse Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>RPIpulse · Dashboard Command</h1>
      <p id="updated-at">loading…</p>
    </header>

    <main class="layout">
      <section class="card kpi">
        <h2>Active Devices</h2>
        <div class="kpi-value" id="active-devices">--</div>
        <p id="trend-text">trend --</p>
      </section>

      <section class="card">
        <h2>24h Summary</h2>
        <ul>
          <li>Samples: <strong id="samples-24h">--</strong></li>
          <li>Avg unique: <strong id="avg-24h">--</strong></li>
          <li>Peak unique: <strong id="peak-24h">--</strong></li>
          <li>Peak raw: <strong id="peak-raw-24h">--</strong></li>
        </ul>
      </section>

      <section class="card">
        <h2>System Health</h2>
        <ul>
          <li>Status: <strong id="health-status">--</strong></li>
          <li>DB path: <code id="health-db">--</code></li>
          <li>Observations: <strong id="health-observations">--</strong></li>
        </ul>
      </section>

      <section class="card chart-card">
        <h2>Daily Peak (30d)</h2>
        <svg id="chart-daily" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
      </section>

      <section class="card chart-card">
        <h2>Hourly Peak (7d)</h2>
        <svg id="chart-hourly" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
      </section>

      <section class="card latest-card">
        <h2>Latest Observation</h2>
        <pre id="latest-json">--</pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
